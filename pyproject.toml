[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verityai"
version = "0.1.0"
description = "Model-agnostic agentic harness: context management, persistent memory, and verification around AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Juan Pablo Botero Espinosa", email = "juanpabloboteroespinosa@gmail.com"}
]
keywords = [
    "llm",
    "agents",
    "context-management",
    "static-analysis",
    "code-graph",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# The core deliberately depends on almost nothing. A harness that manages
# someone else's context must be installable next to any agent without
# dragging in an LLM SDK, a graph database, or a solver -- the pre-pivot
# dependency list (langchain, neo4j, z3, ollama, reportlab, psycopg2) belonged
# to a system that generated and formally verified code, which this no longer
# does. Optional extras below carry anything heavier.
dependencies = [
    # Data models
    "pydantic>=2.0.0",

    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Juanpacol/VerityAI"
Repository = "https://github.com/Juanpacol/VerityAI"
"Architecture decisions" = "https://github.com/Juanpacol/VerityAI/tree/main/docs/adr"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
    "types-requests>=2.32.0",
    "pre-commit>=3.7.0",
]

# Exact token counting. Optional because the harness must run without it --
# degraded to a chars/4 estimate, and saying so in every report.
tokenizers = [
    "tiktoken>=0.7.0",
]

# MCP server, for agents to call the harness directly.
mcp = [
    "mcp>=1.0.0",
]

research = [
    "jupyter>=1.0.0",
    "notebook>=6.5.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.scripts]
verity = "verityai.cli.main:main"
verity-mcp = "verityai.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verityai = ["py.typed"]

[tool.ruff]
line-length = 100
# Raised from py39 on 2026-08-09. The 3.9 pin was inherited from the
# pre-pivot code and from macOS's system interpreter; 3.9 has been
# end-of-life since October 2025, and the MCP SDK requires >=3.10. With the
# old code gone, `X | None` is safe in Pydantic annotations again.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.ruff.lint.isort]
known-first-party = ["verityai"]

[tool.ruff.lint.flake8-bugbear]
# Typer's option idiom is `param: T = typer.Option(...)` -- the call is
# intentional and evaluated once by Typer to build the parser, not a mutable
# default trap. Without this, B008 flags every CLI command.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that exercise multiple components together (offline, no services)",
]
# The MCP server's tools are async, so its tests are too. Auto mode means
# they need no per-test decorator beyond the ones already there.
asyncio_mode = "auto"

[tool.coverage.run]
source = ["verityai"]
omit = ["*/tests/*"]

[tool.coverage.report]
# Single source of truth for the threshold: `make test` and CI both inherit
# it rather than each passing --cov-fail-under and drifting apart. Actual
# coverage sits at 96%; 90 leaves room for a genuinely hard-to-reach branch
# without letting a whole module go untested.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
