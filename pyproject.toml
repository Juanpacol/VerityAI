[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verityai"
version = "0.1.0"
description = "Model-agnostic agentic harness: context management, persistent memory, and verification around AI coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Juan Pablo Botero Espinosa", email = "juanpabloboteroespinosa@gmail.com"}
]

# The core deliberately depends on almost nothing. A harness that manages
# someone else's context must be installable next to any agent without
# dragging in an LLM SDK, a graph database, or a solver -- the pre-pivot
# dependency list (langchain, neo4j, z3, ollama, reportlab, psycopg2) belonged
# to a system that generated and formally verified code, which this no longer
# does. Optional extras below carry anything heavier.
dependencies = [
    # Data models
    "pydantic>=2.0.0",

    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
    "types-requests>=2.32.0",
    "pre-commit>=3.7.0",
]

# Exact token counting. Optional because the harness must run without it --
# degraded to a chars/4 estimate, and saying so in every report.
tokenizers = [
    "tiktoken>=0.7.0",
]

# MCP server, for agents to call the harness directly.
mcp = [
    "mcp>=1.0.0",
]

research = [
    "jupyter>=1.0.0",
    "notebook>=6.5.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.scripts]
verity = "verityai.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verityai = ["py.typed"]

[tool.ruff]
line-length = 100
# Matches requires-python below, NOT the aspirational 3.11 in [tool.mypy] --
# this repo's actual interpreter is 3.9 (see README), and UP045's
# Optional[X] -> X | None rewrite is a runtime TypeError under 3.9 for
# Pydantic models (they evaluate real annotations, not deferred strings).
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.ruff.lint.isort]
known-first-party = ["verityai"]

[tool.ruff.lint.flake8-bugbear]
# Typer's option idiom is `param: T = typer.Option(...)` -- the call is
# intentional and evaluated once by Typer to build the parser, not a mutable
# default trap. Without this, B008 flags every CLI command.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.9"  # matches requires-python and the actual interpreter this runs under
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that exercise multiple components together (still offline/faked unless noted)",
]

[tool.coverage.run]
source = ["verityai"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
