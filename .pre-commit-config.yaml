repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Pinned to match the mypy version pyproject.toml's dev deps install, so
    # the hook and a local `make typecheck` agree.
    rev: v1.19.1
    hooks:
      - id: mypy
        # This hook runs in an isolated venv that sees ONLY these packages,
        # not the project's real dependency tree -- anything the annotations
        # reference has to be listed here. Kept to the runtime deps that
        # actually appear in type positions; the pre-pivot list here still
        # installed z3-solver, sqlalchemy, fastapi and neo4j long after the
        # harness stopped depending on any of them.
        additional_dependencies:
          - pydantic>=2.0.0
        args: [src/verityai]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
